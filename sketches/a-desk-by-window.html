<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sketch A: desk by window</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600&family=Zen+Maru+Gothic:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_shared.css">
<script>if (new URLSearchParams(location.search).get('sky') === 'night') document.documentElement.dataset.theme = 'night';</script>
</head>
<body>
<svg class="room" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Sketch A: a desk facing a wide window, corkboard on the left wall, bookshelf on the right">
  <defs>
    <filter id="wobble" filterUnits="userSpaceOnUse" x="0" y="0" width="1600" height="1000">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="4"/>
      <feDisplacementMap in="SourceGraphic" scale="5"/>
    </filter>
  </defs>

  <g filter="url(#wobble)">
    <g id="wall">
      <line class="l" x1="0" y1="830" x2="1600" y2="830"/>

      <!-- window -->
      <rect class="l f-window" x="560" y="110" width="480" height="360" rx="4"/>
      <g class="day-only">
        <path class="cloud" d="M620,220 a22,22 0 0 1 40,-14 a28,28 0 0 1 52,4 a20,20 0 0 1 22,34 h-110 a18,18 0 0 1 -4,-24 z"/>
        <path class="cloud" d="M860,360 a22,22 0 0 1 40,-14 a28,28 0 0 1 52,4 a20,20 0 0 1 22,34 h-110 a18,18 0 0 1 -4,-24 z"/>
        <path class="cloud" d="M880,180 a16,16 0 0 1 30,-10 a20,20 0 0 1 38,3 a14,14 0 0 1 14,24 h-80 a13,13 0 0 1 -2,-17 z"/>
      </g>
      <g class="night-only">
        <circle class="star" cx="930" cy="200" r="26"/>
        <circle class="f-window" cx="918" cy="192" r="22" style="stroke:none"/>
        <circle class="star" cx="620" cy="170" r="3"/><circle class="star" cx="700" cy="250" r="2.5"/>
        <circle class="star" cx="760" cy="160" r="3"/><circle class="star" cx="640" cy="380" r="2.5"/>
        <circle class="star" cx="860" cy="400" r="3"/><circle class="star" cx="980" cy="330" r="2.5"/>
        <circle class="star" cx="720" cy="420" r="2"/>
      </g>
      <line class="l" x1="800" y1="110" x2="800" y2="470"/>
      <line class="l" x1="560" y1="290" x2="1040" y2="290"/>
      <polygon class="l f-paper" points="544,470 1056,470 1064,486 536,486"/>

      <!-- corkboard -->
      <rect class="l f-paper" x="100" y="180" width="320" height="230" rx="4"/>
      <g transform="rotate(-5 159 234)"><rect class="l f-yellow" x="124" y="204" width="70" height="60" rx="2"/><line class="l" x1="136" y1="226" x2="180" y2="226"/><line class="l" x1="136" y1="242" x2="170" y2="242"/></g>
      <g transform="rotate(4 252 232)"><rect class="l f-pink" x="214" y="200" width="76" height="64" rx="2"/><line class="l" x1="226" y1="224" x2="276" y2="224"/><line class="l" x1="226" y1="240" x2="262" y2="240"/></g>
      <g transform="rotate(-3 349 239)"><rect class="l f-green" x="314" y="210" width="70" height="58" rx="2"/><path class="l" d="M330,240 l9,9 l20,-22"/></g>
      <g transform="rotate(3 182 335)"><rect class="l f-accent" x="140" y="300" width="84" height="70" rx="2"/><line class="l" x1="152" y1="324" x2="210" y2="324"/><line class="l" x1="152" y1="342" x2="196" y2="342"/></g>
      <g transform="rotate(-2 310 336)"><rect class="l f-sky" x="250" y="296" width="120" height="80" rx="2"/><polyline class="l" points="262,362 290,330 312,350 334,318 358,362"/></g>
      <circle class="l f-pink" cx="159" cy="206" r="5"/><circle class="l f-yellow" cx="252" cy="202" r="5"/>
      <circle class="l f-accent" cx="349" cy="212" r="5"/><circle class="l f-green" cx="182" cy="302" r="5"/><circle class="l f-pink" cx="310" cy="298" r="5"/>
    </g>

    <g id="furniture">
      <!-- bookshelf -->
      <rect class="l f-paper" x="1290" y="170" width="230" height="660" rx="3"/>
      <line class="l" x1="1290" y1="302" x2="1520" y2="302"/><line class="l" x1="1290" y1="434" x2="1520" y2="434"/>
      <line class="l" x1="1290" y1="566" x2="1520" y2="566"/><line class="l" x1="1290" y1="698" x2="1520" y2="698"/>
      <rect class="l f-accent" x="1306" y="206" width="22" height="96" rx="2"/><rect class="l f-sky" x="1330" y="192" width="18" height="110" rx="2"/>
      <rect class="l f-yellow" x="1350" y="218" width="26" height="84" rx="2"/><rect class="l f-pink" x="1378" y="200" width="20" height="102" rx="2"/>
      <rect class="l f-green" x="1400" y="212" width="24" height="90" rx="2"/><rect class="l f-accent" x="1436" y="206" width="20" height="96" rx="2" transform="rotate(12 1446 302)"/>
      <rect class="l f-pink" x="1310" y="334" width="26" height="100" rx="2"/><rect class="l f-accent" x="1338" y="346" width="20" height="88" rx="2"/>
      <rect class="l f-sky" x="1360" y="328" width="22" height="106" rx="2"/>
      <rect class="l f-green" x="1410" y="410" width="90" height="24" rx="2"/><rect class="l f-yellow" x="1416" y="388" width="80" height="22" rx="2"/>
      <rect class="l f-green" x="1306" y="474" width="24" height="92" rx="2"/><rect class="l f-yellow" x="1332" y="462" width="22" height="104" rx="2"/>
      <rect class="l f-sky" x="1356" y="480" width="20" height="86" rx="2"/><rect class="l f-accent" x="1380" y="468" width="26" height="98" rx="2"/>
      <rect class="l f-sky" x="1436" y="496" width="56" height="70" rx="2"/><circle class="l f-pink" cx="1464" cy="528" r="14"/>
      <rect class="l f-sky" x="1310" y="598" width="30" height="100" rx="2"/><rect class="l f-pink" x="1342" y="608" width="22" height="90" rx="2"/>
      <rect class="l f-accent" x="1366" y="590" width="24" height="108" rx="2"/><rect class="l f-yellow" x="1394" y="604" width="20" height="94" rx="2"/>
      <rect class="l f-pink" x="1310" y="750" width="120" height="80" rx="3"/><line class="l" x1="1350" y1="772" x2="1390" y2="772"/>
      <rect class="l f-green" x="1446" y="734" width="24" height="96" rx="2"/><rect class="l f-sky" x="1472" y="746" width="22" height="84" rx="2"/>

      <!-- rug + desk -->
      <ellipse class="l f-pink" cx="780" cy="950" rx="520" ry="36"/>
      <line class="l" x1="356" y1="744" x2="356" y2="944"/><line class="l" x1="1204" y1="744" x2="1204" y2="944"/>
      <line class="l" x1="420" y1="744" x2="420" y2="880"/><line class="l" x1="1140" y1="744" x2="1140" y2="880"/>
      <polygon class="l f-paper" points="390,640 1170,640 1240,720 320,720"/>
      <polygon class="l f-paper" points="320,720 1240,720 1240,744 320,744"/>
    </g>

    <g id="objects">
      <polygon class="glow night-only" points="470,548 536,580 720,720 380,720"/>

      <!-- lamp -->
      <ellipse class="l f-paper" cx="440" cy="694" rx="36" ry="9"/>
      <polyline class="l" points="440,690 456,580 506,534"/>
      <polygon class="l f-yellow" points="500,505 560,535 536,580 470,548"/>

      <!-- envelope -->
      <g transform="rotate(-6 594 678)">
        <rect class="l f-pink" x="548" y="648" width="92" height="60" rx="3"/>
        <polyline class="l" points="548,650 594,684 640,650"/>
      </g>

      <!-- laptop -->
      <rect class="l f-paper" x="690" y="520" width="220" height="142" rx="6"/>
      <polyline class="l" points="708,538 708,644 892,644"/>
      <polyline class="curve" points="716,548 740,590 770,612 805,624 845,631 886,634"/>
      <polygon class="l f-paper" points="670,668 930,668 955,700 645,700"/>
      <line class="l" x1="780" y1="688" x2="820" y2="688"/>

      <!-- mug -->
      <path class="l" d="M1046,656 q24,0 24,17 q0,17 -24,17"/>
      <rect class="l f-yellow" x="990" y="640" width="56" height="62" rx="7"/>
      <path class="l" d="M1006,624 q-9,-14 0,-28 q9,-14 0,-28"/>
      <path class="l" d="M1030,624 q-9,-14 0,-28 q9,-14 0,-28"/>

      <!-- phone -->
      <polygon class="l f-accent" points="1096,676 1150,676 1166,712 1104,712"/>
      <line class="l" x1="1122" y1="704" x2="1142" y2="704"/>
    </g>

    <g id="foreground">
      <!-- plant -->
      <ellipse class="l f-green" cx="196" cy="800" rx="16" ry="46" transform="rotate(-28 196 800)"/>
      <ellipse class="l f-green" cx="252" cy="790" rx="16" ry="48" transform="rotate(22 252 790)"/>
      <ellipse class="l f-green" cx="224" cy="770" rx="15" ry="46"/>
      <polygon class="l f-pink" points="178,850 270,850 258,950 190,950"/>
    </g>
  </g>

  <g id="labels">
    <text class="lab" x="800" y="92">window · sky</text>
    <text class="lab" x="260" y="446">corkboard · experience</text>
    <text class="lab" x="1405" y="150">bookshelf · education</text>
    <text class="lab" x="560" y="792">envelope · contact</text>
    <text class="lab" x="800" y="792">laptop · projects</text>
    <text class="lab" x="1040" y="792">mug · about</text>
  </g>
</svg>
<p class="caption">Sketch A: desk by window</p>
</body>
</html>
