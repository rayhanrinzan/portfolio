<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sketch B: corner with shelf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600&family=Zen+Maru+Gothic:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_shared.css">
<script>if (new URLSearchParams(location.search).get('sky') === 'night') document.documentElement.dataset.theme = 'night';</script>
</head>
<body>
<svg class="room" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Sketch B: a room corner with a window on the left wall, and a corkboard, desk and tall bookshelf on the right wall">
  <defs>
    <filter id="wobble" filterUnits="userSpaceOnUse" x="0" y="0" width="1600" height="1000">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="5"/>
    </filter>
  </defs>

  <g filter="url(#wobble)">
    <g id="wall">
      <!-- corner + floor joins -->
      <line class="l" x1="620" y1="0" x2="620" y2="700"/>
      <line class="l" x1="620" y1="700" x2="0" y2="900"/>
      <line class="l" x1="620" y1="700" x2="1600" y2="812"/>

      <!-- window on the left wall -->
      <polygon class="l f-window" points="150,170 480,200 480,490 150,560"/>
      <g class="day-only">
        <path class="cloud" d="M190,270 a22,22 0 0 1 40,-14 a28,28 0 0 1 52,4 a20,20 0 0 1 22,34 h-110 a18,18 0 0 1 -4,-24 z"/>
        <path class="cloud" d="M330,410 a16,16 0 0 1 30,-10 a20,20 0 0 1 38,3 a14,14 0 0 1 14,24 h-80 a13,13 0 0 1 -2,-17 z"/>
      </g>
      <g class="night-only">
        <circle class="star" cx="400" cy="270" r="24"/>
        <circle class="f-window" cx="389" cy="263" r="20" style="stroke:none"/>
        <circle class="star" cx="200" cy="240" r="3"/><circle class="star" cx="270" cy="300" r="2.5"/>
        <circle class="star" cx="220" cy="440" r="3"/><circle class="star" cx="360" cy="420" r="2.5"/>
        <circle class="star" cx="300" cy="230" r="2"/><circle class="star" cx="440" cy="390" r="2.5"/>
      </g>
      <line class="l" x1="315" y1="185" x2="315" y2="525"/>
      <line class="l" x1="150" y1="365" x2="480" y2="345"/>
      <polygon class="l f-paper" points="136,564 492,490 492,504 136,582"/>

      <!-- corkboard on the right wall -->
      <polygon class="l f-paper" points="700,220 1090,200 1090,470 700,462"/>
      <g transform="rotate(-5 765 276)"><rect class="l f-yellow" x="728" y="246" width="74" height="62" rx="2"/><line class="l" x1="740" y1="268" x2="788" y2="268"/><line class="l" x1="740" y1="284" x2="776" y2="284"/></g>
      <g transform="rotate(4 870 270)"><rect class="l f-sand" x="832" y="238" width="78" height="66" rx="2"/><line class="l" x1="844" y1="262" x2="896" y2="262"/><line class="l" x1="844" y1="278" x2="882" y2="278"/></g>
      <g transform="rotate(-3 1000 262)"><rect class="l f-stone" x="964" y="232" width="72" height="60" rx="2"/><path class="l" d="M980,262 l9,9 l20,-22"/></g>
      <g transform="rotate(3 790 392)"><rect class="l f-accent" x="746" y="356" width="88" height="72" rx="2"/><line class="l" x1="758" y1="380" x2="820" y2="380"/><line class="l" x1="758" y1="398" x2="804" y2="398"/></g>
      <g transform="rotate(-2 950 386)"><rect class="l f-sky" x="886" y="344" width="128" height="84" rx="2"/><polyline class="l" points="898,414 928,380 952,402 976,368 1002,414"/></g>
      <circle class="l f-sand" cx="765" cy="248" r="5"/><circle class="l f-yellow" cx="870" cy="240" r="5"/>
      <circle class="l f-accent" cx="1000" cy="234" r="5"/><circle class="l f-stone" cx="790" cy="358" r="5"/><circle class="l f-sand" cx="950" cy="346" r="5"/>

      <polygon class="glow night-only" points="480,330 600,330 740,880 340,880"/>
    </g>

    <g id="furniture">
      <!-- bookshelf -->
      <g transform="translate(50 6)">
        <polygon class="l f-paper" points="1180,150 1480,130 1480,800 1180,770"/>
        <line class="l" x1="1180" y1="274" x2="1480" y2="264"/><line class="l" x1="1180" y1="398" x2="1480" y2="398"/>
        <line class="l" x1="1180" y1="522" x2="1480" y2="532"/><line class="l" x1="1180" y1="646" x2="1480" y2="666"/>
        <rect class="l f-accent" x="1200" y="181" width="22" height="92" rx="2"/><rect class="l f-sky" x="1224" y="192" width="20" height="80" rx="2"/>
        <rect class="l f-yellow" x="1246" y="174" width="26" height="98" rx="2"/><rect class="l f-sand" x="1274" y="185" width="20" height="86" rx="2"/>
        <rect class="l f-sky" x="1380" y="195" width="60" height="72" rx="2"/><circle class="l f-sand" cx="1410" cy="228" r="14"/>
        <rect class="l f-sand" x="1200" y="298" width="24" height="100" rx="2"/><rect class="l f-accent" x="1226" y="310" width="20" height="88" rx="2"/>
        <rect class="l f-sky" x="1248" y="294" width="22" height="104" rx="2"/>
        <rect class="l f-stone" x="1330" y="374" width="100" height="24" rx="2"/><rect class="l f-yellow" x="1338" y="352" width="84" height="22" rx="2"/>
        <rect class="l f-stone" x="1200" y="427" width="26" height="96" rx="2"/><rect class="l f-yellow" x="1228" y="440" width="20" height="84" rx="2"/>
        <rect class="l f-sky" x="1250" y="422" width="24" height="102" rx="2"/><rect class="l f-accent" x="1276" y="435" width="22" height="90" rx="2"/>
        <rect class="l f-sand" x="1400" y="435" width="24" height="94" rx="2"/><rect class="l f-stone" x="1426" y="448" width="22" height="82" rx="2"/>
        <rect class="l f-sky" x="1200" y="547" width="28" height="100" rx="2"/><rect class="l f-sand" x="1230" y="559" width="22" height="90" rx="2"/>
        <rect class="l f-accent" x="1254" y="545" width="24" height="106" rx="2"/>
        <rect class="l f-yellow" x="1380" y="603" width="60" height="56" rx="3"/>
        <rect class="l f-sand" x="1200" y="700" width="120" height="76" rx="3"/><line class="l" x1="1240" y1="722" x2="1280" y2="722"/>
        <rect class="l f-stone" x="1420" y="698" width="24" height="96" rx="2"/><rect class="l f-sky" x="1446" y="713" width="22" height="84" rx="2"/>
      </g>

      <!-- rug + desk -->
      <ellipse class="l f-sand" cx="900" cy="940" rx="420" ry="36"/>
      <line class="l" x1="616" y1="752" x2="616" y2="930"/><line class="l" x1="1176" y1="752" x2="1176" y2="930"/>
      <line class="l" x1="680" y1="752" x2="680" y2="860"/><line class="l" x1="1126" y1="752" x2="1126" y2="868"/>
      <polygon class="l f-paper" points="660,640 1150,640 1200,730 590,730"/>
      <polygon class="l f-paper" points="590,730 1200,730 1200,752 590,752"/>

      <!-- floor lamp -->
      <ellipse class="l f-paper" cx="540" cy="880" rx="44" ry="10"/>
      <line class="l" x1="540" y1="876" x2="540" y2="330"/>
      <polygon class="l f-yellow" points="480,330 600,330 578,250 502,250"/>
    </g>

    <g id="objects">
      <!-- envelope + phone -->
      <g transform="rotate(-6 707 667)">
        <rect class="l f-sand" x="664" y="640" width="86" height="54" rx="3"/>
        <polyline class="l" points="664,642 707,672 750,642"/>
      </g>
      <polygon class="l f-accent" points="632,702 690,702 696,724 628,724"/>
      <line class="l" x1="652" y1="718" x2="672" y2="718"/>

      <!-- laptop -->
      <rect class="l f-paper" x="800" y="524" width="200" height="132" rx="6"/>
      <polyline class="l" points="816,540 816,640 984,640"/>
      <polyline class="curve" points="824,550 846,588 874,608 906,620 942,627 978,630"/>
      <polygon class="l f-paper" points="782,660 1018,660 1040,694 760,694"/>
      <line class="l" x1="880" y1="682" x2="920" y2="682"/>

      <!-- mug -->
      <path class="l" d="M1120,662 q22,0 22,16 q0,16 -22,16"/>
      <rect class="l f-yellow" x="1070" y="648" width="50" height="58" rx="7"/>
      <path class="l" d="M1084,632 q-9,-14 0,-28 q9,-14 0,-28"/>
      <path class="l" d="M1106,632 q-9,-14 0,-28 q9,-14 0,-28"/>
    </g>

    <g id="foreground">
      <!-- plant -->
      <ellipse class="l f-stone" cx="222" cy="800" rx="16" ry="46" transform="rotate(-28 222 800)"/>
      <ellipse class="l f-stone" cx="280" cy="790" rx="16" ry="48" transform="rotate(22 280 790)"/>
      <ellipse class="l f-stone" cx="250" cy="770" rx="15" ry="46"/>
      <polygon class="l f-sand" points="204,850 296,850 284,950 216,950"/>
    </g>
  </g>

  <g id="labels">
    <text class="lab" x="315" y="140">sky</text>
    <text class="lab" x="895" y="186">experience</text>
    <text class="lab" x="1380" y="120">education</text>
    <text class="lab" x="672" y="800">contact</text>
    <text class="lab" x="912" y="800">projects</text>
    <text class="lab" x="1112" y="800">about</text>
  </g>
</svg>
<p class="caption">Sketch B: corner with shelf</p>
</body>
</html>
